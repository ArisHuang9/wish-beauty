                                        <div><label className="block text-[10px] font-bold text-slate-400 mb-2 ml-1 uppercase tracking-wider">主治醫師</label><select value={selectedDoctor} onChange={(e) => setSelectedDoctor(e.target.value)} className="w-full p-3 bg-slate-50 border-none rounded-xl text-slate-700 text-sm font-bold">{DOCTORS.map(d => <option key={d} value={d}>{d}</option>)}</select></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-[10px] font-bold text-slate-400 mb-2 ml-1 uppercase tracking-wider">客人身份別</label><input type="text" value={guestOccupation} onChange={(e) => setGuestOccupation(e.target.value)} className="w-full p-3 bg-slate-50 border-none rounded-xl outline-none text-sm text-slate-700 font-bold" placeholder="例：老師"/></div>
                                                                                <div><label className="block text-[10px] font-bold text-slate-400 mb-2 ml-1 uppercase tracking-wider">諮詢師姓名</label><input type="text" value={staffName} onChange={(e) => setStaffName(e.target.value)} className="w-full p-3 bg-slate-50 border-none rounded-xl outline-none text-sm text-slate-700 font-bold" placeholder="名字"/></div>
                                    </div>
                                    <button onClick={generateReview} className="w-full py-5 btn-primary rounded-3xl font-bold text-lg shadow-xl active:scale-95 transition-all flex items-center justify-center gap-2"><i className="fas fa-magic"></i>產出自然感好評</button>
                                </div>
                            </div>
                            {generatedReview && (
                                <div className="card p-6 border-t-8 border-[#ff7f50] animate-in slide-in-from-bottom-8 duration-700">
                                    <div className="flex justify-between items-center mb-5"><h2 className="font-bold text-slate-700 flex items-center font-bold">02 複製文字</h2><div className="flex text-[#ff7f50] gap-1 scale-90">{[1,2,3,4,5].map(i => <i key={i} className="fas fa-star"></i>)}</div></div>
                                    <div className="bg-[#fffbf9] p-5 rounded-3xl text-slate-600 leading-relaxed text-sm mb-6 relative italic border border-[#fff1eb]">「{generatedReview}」</div>
                                    <div className="flex flex-col gap-3">
                                        <button onClick={copyToClipboard} className={`w-full py-4 rounded-xl font-bold flex items-center justify-center gap-2 transition-all ${copySuccess ? 'bg-green-500 text-white shadow-inner' : 'btn-secondary shadow-sm'}`}><i className={`fas ${copySuccess ? 'fa-check' : 'fa-copy'}`}></i>{copySuccess ? '文案已複製！' : '一鍵複製心得文案'}</button>
                                                                                <a href={googleLink || '#'} target="_blank" className={`w-full py-4 bg-slate-800 text-white rounded-xl font-bold flex items-center justify-center gap-2 shadow-md ${!googleLink && 'opacity-20'}`} onClick={(e) => !googleLink && e.preventDefault()}><i className="fab fa-google"></i>前往 Google 評論貼上</a>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                    <footer className="mt-16 text-center space-y-1"><p className="text-slate-300 text-[10px] tracking-widest uppercase">© 2026 {CLINIC_NAME} | 品牌專屬優化版</p></footer>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
